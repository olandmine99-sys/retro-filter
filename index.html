<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レトロゲーム風フィルター ＆ サムネジェネレーター</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { font-size: 20px; color: #444; }
        .controls { margin: 15px 0; }
        
        .text-tool {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        input[type="text"] {
            padding: 8px;
            width: 60%;
            font-family: 'DotGothic16', sans-serif;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="color"] { cursor: pointer; height: 35px; border: none; }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            background-color: #007BFF;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        canvas {
            max-width: 100%;
            height: auto;
            border: 2px solid #333;
            border-radius: 4px;
            margin-top: 10px;
            image-rendering: pixelated; 
            display: none; /* 最初は非表示 */
        }

        /* ローディング演出のスタイル */
        #loading {
            display: none;
            font-family: 'DotGothic16', sans-serif;
            font-size: 24px;
            color: #e74c3c;
            margin: 30px 0;
            animation: blink 1s infinite; /* 1秒間隔で点滅 */
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* 広告スペースのスタイル */
        .ad-space {
            margin: 20px auto;
            padding: 10px;
            background-color: #f8f9fa;
            border: 1px dashed #ccc;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>レトロゲーム風フィルター</h1>
    
    <input type="file" id="imageInput" accept="image/*">
    
    <div class="text-tool">
        <input type="text" id="textInput" placeholder="レトロ文字を入力..." disabled>
        <input type="color" id="textColor" value="#ffffff" disabled>
        <button id="btnRedraw" disabled>文字を反映</button>
    </div>
    
    <div class="controls">
        <button id="btnGB" disabled>GB風 (4色・緑)</button>
        <button id="btnVB" disabled>VB風 (4色・赤)</button>
        <button id="btnGBC" disabled>GBC風 (16色)</button>
    </div>

    <!-- ここに楽天アフィリエイトのコードを貼り付けます -->

    </div>

    <!-- ローディング文字 -->
    <div id="loading">画像をAI（？）で解析・変換中...</div>

    <canvas id="canvas"></canvas>
    
    <div class="controls">
      <div class="controls">
        <button id="btnDownload" style="background-color: #28a745; display: none;">画像をダウンロード</button>
    </div>

    <!-- 追加：シェアボタンのエリア（最初は非表示） -->
    <div class="controls" id="shareControls" style="display: none;">
        <button id="btnShareX" style="background-color: #000000; color: #ffffff;">𝕏 でシェアする</button>
    </div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const textInput = document.getElementById('textInput');
    const textColor = document.getElementById('textColor');
    const btnRedraw = document.getElementById('btnRedraw');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const loading = document.getElementById('loading');
    
    const btnGB = document.getElementById('btnGB');
    const btnVB = document.getElementById('btnVB');
    const btnGBC = document.getElementById('btnGBC');
    const btnDownload = document.getElementById('btnDownload');

    let originalImage = new Image();
    let currentPalette = null;

    const palettes = {
        GB: [[15, 56, 15], [48, 98, 48], [139, 172, 15], [155, 188, 15]],
        VB: [[0, 0, 0], [115, 0, 0], [225, 0, 0], [255, 0, 0]],
        GBC: [
            [0,0,0], [255,255,255], [255,0,0], [0,255,0], 
            [0,0,255], [255,255,0], [0,255,255], [255,0,255],
            [192,192,192], [128,128,128], [128,0,0], [128,128,0],
            [0,128,0], [128,0,128], [0,128,128], [0,0,128]
        ]
    };

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            originalImage.onload = function() {
                btnGB.disabled = false; btnVB.disabled = false; btnGBC.disabled = false;
                textInput.disabled = false; textColor.disabled = false; btnRedraw.disabled = false;
                currentPalette = palettes.GB;
                triggerProcess(); 
            }
            originalImage.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    btnGB.addEventListener('click', () => { currentPalette = palettes.GB; triggerProcess(); });
    btnVB.addEventListener('click', () => { currentPalette = palettes.VB; triggerProcess(); });
    btnGBC.addEventListener('click', () => { currentPalette = palettes.GBC; triggerProcess(); });
    btnRedraw.addEventListener('click', () => { if(currentPalette) triggerProcess(); });

    // ローディングを挟むための関数
    function triggerProcess() {
        // 画像とダウンロードボタンを隠し、ローディングを表示
        canvas.style.display = 'none';
        btnDownload.style.display = 'none';
        loading.style.display = 'block';

        // 2000ミリ秒（2秒）後に実際の処理を実行
        setTimeout(() => {
            processImage();
        }, 2000);
    }

    function processImage() {
        if (!originalImage.src || !currentPalette) return;

        const retroWidth = 160; 
        const scale = retroWidth / originalImage.width;
        const retroHeight = Math.floor(originalImage.height * scale);

        const outputWidth = Math.max(originalImage.width, 700);
        const outputScale = outputWidth / originalImage.width;
        const outputHeight = Math.floor(originalImage.height * outputScale);

        const offCanvas = document.createElement('canvas');
        offCanvas.width = retroWidth;
        offCanvas.height = retroHeight;
        const offCtx = offCanvas.getContext('2d');

        offCtx.drawImage(originalImage, 0, 0, retroWidth, retroHeight);
        const imageData = offCtx.getImageData(0, 0, retroWidth, retroHeight);
        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
            if (data[i + 3] === 0) continue; 
            const closestColor = getClosestColor(data[i], data[i + 1], data[i + 2], currentPalette);
            data[i] = closestColor[0];
            data[i + 1] = closestColor[1];
            data[i + 2] = closestColor[2];
        }
        offCtx.putImageData(imageData, 0, 0);

        canvas.width = outputWidth;
        canvas.height = outputHeight;
        ctx.imageSmoothingEnabled = false; 
        ctx.drawImage(offCanvas, 0, 0, retroWidth, retroHeight, 0, 0, outputWidth, outputHeight);
        
        const text = textInput.value;
        if (text) {
            const fontSize = Math.floor(outputWidth * 0.08); 
            ctx.font = `${fontSize}px 'DotGothic16', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            const textX = outputWidth / 2;
            const textY = outputHeight - (outputHeight * 0.05);

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = Math.floor(fontSize * 0.15);
            ctx.lineJoin = 'round';
            ctx.strokeText(text, textX, textY);

            ctx.fillStyle = textColor.value;
            ctx.fillText(text, textX, textY);
        }

        // 処理が終わったらローディングを消して、画像とボタンを表示
        loading.style.display = 'none';
        canvas.style.display = 'block';
        btnDownload.style.display = 'inline-block';
    }

    function getClosestColor(r, g, b, palette) {
        let minDistance = Infinity;
        let closestColor = palette[0];
        for (let i = 0; i < palette.length; i++) {
            const distance = Math.sqrt(Math.pow(r - palette[i][0], 2) + Math.pow(g - palette[i][1], 2) + Math.pow(b - palette[i][2], 2));
            if (distance < minDistance) {
                minDistance = distance;
                closestColor = palette[i];
            }
        }
        return closestColor;
    }

    btnDownload.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'retro_thumbnail.png';
        link.href = canvas.toDataURL();
        link.click();
        // シェアボタンの取得
    const shareControls = document.getElementById('shareControls');
    const btnShareX = document.getElementById('btnShareX');

    // ★ processImage() 関数の最後でシェアボタンを表示させるための修正
    // processImage 関数の中にある btnDownload.style.display = 'inline-block'; のすぐ下に、
    // shareControls.style.display = 'block'; を追記してください。（すでに追記する場合は上書きでOKです）
    // 処理が終わったらローディングを消して、画像とボタンを表示
        loading.style.display = 'none';
        canvas.style.display = 'block';
        btnDownload.style.display = 'inline-block';
        shareControls.style.display = 'block'; // ←これを追加

    // X（Twitter）シェアボタンの動作
    btnShareX.addEventListener('click', () => {
        // シェアするテキストとURLをエンコード（文字化け防止）
        const shareText = encodeURIComponent("レトロゲーム風フィルターで遊ぶ\n#レトロフィルター\n");
        // 現在のページのURLを自動的に取得してシェアURLに設定します
        const shareUrl = encodeURIComponent(window.location.href);
        
        // Xの投稿画面を新しいタブで開く
        window.open(`https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}`, '_blank');
    });
    });
</script>
